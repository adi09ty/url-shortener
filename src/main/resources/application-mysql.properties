# MySQL + Redis. Every value comes from the environment: nothing secret is stored in the repo.
# There are deliberately no defaults for the database settings, so the app will not start without them.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Short timeouts: if Redis is slow or down, give up fast and use the database (see RedisClientConfig).
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms

app.redis.enabled=true
management.health.redis.enabled=true
app.base-url=${APP_BASE_URL:http://localhost:8080}
