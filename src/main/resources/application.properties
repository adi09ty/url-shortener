spring.application.name=url-shortener

# Default profile: in-memory H2 database, in-memory cache and rate limiter. No setup needed.
# Run with the "mysql" profile for MySQL + Redis (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health
management.health.redis.enabled=false

# Application settings
app.base-url=http://localhost:8080
app.redis.enabled=false
app.cache.ttl=1h
app.rate-limit.create-per-window=20
app.rate-limit.redirect-per-window=120
app.rate-limit.window=1m
